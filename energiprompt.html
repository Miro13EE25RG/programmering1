        var player = { x: 50, y: 200, size: 40, color: "red", speedX: 9.5, directionX: 1, directionY: 1, scrollingSpeed: 5, bounces: 0};



        var x = 0;


            //får inte bounces att visas. jScript klagar om att ha text("bounces" + player.bounces, 10, 30, "black", 20); i update() funktionen.
        function update(framespersecond = 120) {
            clearScreen()
            


            //ritar bakgrund
            picture(x, 0, "https://shorturl.at/9F9lR", totalWidth * 2, totalHeight);    
            if(keyboard.d)
            {
                x = x - player.scrollingSpeed;
            }
            if(keyboard.a)
            {
                x = x + player.scrollingSpeed;
            }

            



            circle(player.x, player.y, player.size, player.color);
            player.x = player.x + player.speedX * player.directionX;
            player.y = player.y + player.speedX * player.directionY;

            //studsa mot höger kant
            if(player.x + player.size > totalWidth) {
                player.directionX = -1
                player.bounces = player.bounces + 1
            }
            //studsa mot vänster kant
            if(player.x - player.size < 0) {
                player.directionX = 1
                player.bounces = player.bounces + 1
            }
            //studsa mot taket
            if(player.y - player.size < 0) {
                player.directionY = 1
                player.bounces = player.bounces + 1
            }
            //studsa mot golvet
            if(player.y + player.size > totalHeight) {
                player.directionY = -1
                player.bounces = player.bounces + 1
            }

            text(100, 100, 30, player.bounces, "white")
        }







































        
    </script>
