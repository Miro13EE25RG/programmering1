function applyHitDamage(tower, enemy) { //används för att räkna ut hur mycket skada som fienden tar när den träffas av ett torns projektil.
    var projectile = tower.ammoType;

    if (enemy.armorHit && !projectile.armorHit) {
        return 0;
    }

    var damage = tower.damage * projectile.damageMultiplier;
    enemy.health = Math.max(0, enemy.health - damage);
    return damage;
}

function isEnemyDead(enemy) { //avgör om fienden är död eller ej.
    return enemy.health <= 0;
}

function drawButton(x, y, width, height, label) {
    rectangle(x, y, width, height, "black");
    text(x + 16, y + height * 0.65, 22, label, "white");
}

function isMouseOver(x, y, width, height) {
    return mouse.x >= x && mouse.x <= x + width &&
        mouse.y >= y && mouse.y <= y + height;
}

function getMapCardX(index) {
    var cardWidth = totalWidth * 0.26;
    var gap = totalWidth * 0.04;
    var startX = (totalWidth - (cardWidth * maps.length + gap * (maps.length - 1))) / 2;
    return startX + index * (cardWidth + gap);
}

function drawMap(map, x, y, width, height) {
    rectangle(x, y, width, height, map.backgroundColor);

    for (var i = 0; i < map.pathSegments.length; i++) {
        var segment = map.pathSegments[i];
        rectangle(
            x + segment[0] * width,
            y + segment[1] * height,
            segment[2] * width,
            segment[3] * height,
            map.pathColor
        );
    }
}

function drawMenu() {
    rectangle(0, 0, totalWidth, totalHeight, "darkgrey");
    text(totalWidth * 0.36, totalHeight * 0.32, 40, "Tower Defense", "white");
    drawButton(totalWidth * 0.35, totalHeight * 0.5, totalWidth * 0.3, 60, "Choose a map");
}

function drawMapSelect() {
    rectangle(0, 0, totalWidth, totalHeight, "darkgrey");
    text(totalWidth * 0.33, totalHeight * 0.18, 32, "Choose a map", "white");

    var cardY = totalHeight * 0.3;
    var cardWidth = totalWidth * 0.26;
    var cardHeight = totalHeight * 0.42;

    for (var i = 0; i < maps.length; i++) {
        var cardX = getMapCardX(i);
        rectangle(cardX, cardY, cardWidth, cardHeight, "black");
        drawMap(maps[i], cardX + 6, cardY + 6, cardWidth - 12, cardHeight * 0.68);
        text(cardX + 16, cardY + cardHeight * 0.88, 22, maps[i].name, "white");
    }

    drawButton(totalWidth * 0.05, totalHeight * 0.84, totalWidth * 0.2, 50, "Back");
}

function drawGameScene() {
    drawMap(selectedMap, 0, 0, totalWidth, totalHeight);
    text(totalWidth * 0.4 - 40, 35, 26, selectedMap.name + " map", "black");
    drawButton(12, 10, 160, 44, "Main menu");
}

function update() {
    clearScreen();

    var mouseClicked = mouse.left && !mouseWasDown;
    mouseWasDown = mouse.left;

    if (currentScene === "menu") {
        if (mouseClicked && isMouseOver(totalWidth * 0.35, totalHeight * 0.5, totalWidth * 0.3, 60)) {
            currentScene = "mapSelect";
        }
    } else if (currentScene === "mapSelect") {
        var cardY = totalHeight * 0.3;
        var cardWidth = totalWidth * 0.26;
        var cardHeight = totalHeight * 0.42;

        if (mouseClicked && isMouseOver(totalWidth * 0.05, totalHeight * 0.84, totalWidth * 0.2, 50)) {
            currentScene = "menu";
        } else if (mouseClicked) {
            for (var i = 0; i < maps.length; i++) {
                if (isMouseOver(getMapCardX(i), cardY, cardWidth, cardHeight)) {
                    selectedMap = maps[i];
                    currentScene = "game";
                    break;
                }
            }
        }
    } else if (currentScene === "game") {
        if (mouseClicked && isMouseOver(12, 10, mainMenuButtonWidth, 44)) {
            currentScene = "menu";
        }
    }

    if (currentScene === "menu") {
        drawMenu();
    } else if (currentScene === "mapSelect") {
        drawMapSelect();
    } else if (currentScene === "game") {
        drawGameScene();
    }
}
