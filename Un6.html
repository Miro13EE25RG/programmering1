        var game = { lives: 20, money: 100, score: 0, wave: 1, gameOver: false }; // Game state variables
        var towers = [];
        var enemies = [

        var towerTypes = { // different types of towers with different costs, ranges, damage, fire rates, and levels. The level determines how many upgrades the tower has.
            none: { cost: 0, range: 0, damage: 0, fireRate: 0, level: 0 },
            basic: { cost: 50, range: 120, damage: 1, fireRate: 30, level: 1 },
            sniper: { cost: 100, range: 200, damage: 3, fireRate: 25, level: 1 },
            rapid: { cost: 90, range: 100, damage: 0.5, fireRate: 40, level: 1 }
        }; //this can be used to call on a specific tower type, either for its stats or to create a new tower of that type. For example, towerTypes.basic.cost would return 50, and towers.push({ x: 100, y: 100, type: "basic", level: 1 }) would create a new basic tower at (100, 100) with level 1.

        var projectiles = [ //different types of projectiles with different speeds, damage, and colors. Damage is by default bound to the tower's damage stat, though can vary.
             { speed: 5, damage: towerTypes[selectedTowerType].damage, color: "black" }
        ];
        var enemyPath = [ // the route enemies will take, defined by a series of points. The enemies will move from one point to the next in order.
            { x: 0, y: totalHeight / 3 },
            { x: totalWidth / 3, y: totalHeight / 3 },
            { x: totalWidth / 3, y: totalHeight * 2 / 3 },
            { x: totalWidth * 2 / 3, y: totalHeight * 2 / 3 },
            { x: totalWidth, y: totalHeight / 3 }
        ];

        // var array = [ 4,3,6,4,7,1 ] this is an example of an array, which is a list of values that can be accessed by their index. For example, array[0] would return 4, and array[3] would return 4. Arrays can be used to store multiple values in a single variable, and can be iterated over using loops.
        

        function drawTower(tower) { // this function draws a tower at the specified x and y coordinates, with the specified type and level. The tower's color is determined by its type, and its size is determined by its level. This cannot be used to create a new tower, only to draw an existing one. To create a new tower, use towers.push({ x: 100, y: 100, type: "basic", level: 1 }) for example.
            save();
            translate(tower.x, tower.y);
            circle(0, 0, 20, "gray");
            text(0, -30, 12, tower.type + " (Lvl " + tower.level + ")", "black");
            restore();
        }
        

        var selectedTowerType = "basic", // the type of tower currently selected for placement
            selectedTower = null; // the tower currently selected for upgrade or sale
        var waveState = { enemiesToSpawn: 0, spawnTimer: 0, active: false }; // State variables for the current wave of enemies. spawnTimer determines how long until the next enemy spawns. enemiesToSpawn is how many enemies are left to spawn in the current wave.
