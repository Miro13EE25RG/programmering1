<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapitel 1 Lektion 2</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">



  // Skapar ett objekt för spelaren (player)
  var player = { x: totalWidth/2,
     y: totalHeight - totalHeight/3,
     size: 50,
    color: "#E8BEAC",
      color2: randomColor( 256, 256, 256),
        speedY: 0,
         speedX: 0,
       acceleration: 0.5,
         maxSpeed: 5 };


  //skapar ett objekt för fienden (enemy)
  var enemy = { x: totalWidth/2,
     y: totalHeight - totalHeight/3,
      size: random(30, 85),
      color: randomColor(random(60), random(80, 255), random(60)),
      speedY: 0,
      speedX: 0,
      acceleration: random(0.5, 1),
     maxSpeed: random(4.9, 5.3) };


///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

updatesPerSecond = 60 ;// Sätter uppdateringsfrekvensen till 60 gånger per sekund
function update() {
  

clearScreen(); // Rensa skärmen innan nästa ritning


  rectangle(0, 0, 4680, 3200, "lightblue"); // Rita bakgrundshimmel
  rectangle(0, totalHeight - totalHeight/3, totalWidth, totalHeight - totalHeight/10, "green"); // Rita bakgrundsmark
  
      // Rita andra figuren med objektets egenskaper
  circle(player.x, player.y, player.size - 10, player.color2);



    line(player.x, player.y, player.x, player.y + 180, 20, player.color2); // Rita en Kropp från (100, 100) till (300, 300) med slumpmässig färg.


    line(player.x, player.y + 80, player.x + 30
, player.y + 150, 20, player.color2); // Rita en Vänsterarm från (100, 100) till (300, 300) med slumpmässig färg.

    line(player.x, player.y + 80, player.x - 30
, player.y + 150, 20, player.color2); // Rita en Högerarm från (100, 100) till (300, 300) med slumpmässig färg.


    line(player.x, player.y + 180, player.x + 30
, player.y + 270, 20, player.color2); // Rita ett Vänsterben från (100, 100) till (300, 300) med slumpmässig färg.
    line(player.x, player.y + 180, player.x + 25
, player.y + 265, 27, "black"); // Rita en Vänsterbyxa från (100, 100) till (300, 300) med färgen svart.

    line(player.x, player.y + 180, player.x - 30, player.y + 270, 20, player.color2); // Rita ett Högerben från (100, 100) till (300, 300) med färgen svart.
    line(player.x, player.y + 180, player.x - 25, player.y + 265, 27, "black"); // Rita en Högerbyxa från (100, 100) till (300, 300) med färgen svart.

    line(player.x, player.y + 60, player.x, player.y + 180, 25, "grey"); // Rita en tröja från (100, 100) till (300, 300) med färgen svart.

    arc(player.x, player.y + 20, 20, 180, Math.PI * 2, "black"); // Rita en mun från (100, 100) med radien 180 och färgen svart.

    
    var directionX = 0;
    var directionY = 0;

    if (keyboard.a) directionX -= 1;
    if (keyboard.d) directionX += 1;
    if (keyboard.w) directionY -= 1;
    if (keyboard.s) directionY += 1;

    if (directionX !== 0 || directionY !== 0) {
      var directionLength = Math.sqrt(directionX * directionX + directionY * directionY);
      player.speedX += directionX / directionLength * player.acceleration;
      player.speedY += directionY / directionLength * player.acceleration;
    } else {
      player.speedX *= 0.8;
      player.speedY *= 0.8;
    }

    var currentSpeed = Math.sqrt(player.speedX * player.speedX + player.speedY * player.speedY);
    if (currentSpeed > player.maxSpeed) {
      player.speedX = player.speedX / currentSpeed * player.maxSpeed;
      player.speedY = player.speedY / currentSpeed * player.maxSpeed;
    }

    player.x += player.speedX;
    player.y += player.speedY;

    if(player.x > totalWidth - 50) {
      player.x = totalWidth - 50;
    }
    if(player.x < 50) {
      player.x = 50;
    }
    if(player.y > totalHeight - 240) {
      player.y = totalHeight - 240;
    }
    if(player.y < 30) {
      player.y = 30;
    }
///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    
    // Rita fienden med objektets egenskaper
    circle(enemy.x, enemy.y, enemy.size - 10, enemy.color); // Rita fienden som en cirkel med slumpmässig färg och storlek.
    rectangle(enemy.x - 25, enemy.y + 20, 50, 100, "grey"); // Rita fiendens kropp som en rektangel med färgen grå.



} // end of code block

  </script>
</body>
</html>
