var player = { x: 100, y: 400, size: 20, color: "blue", speed: 4 };

}

function power(x, y, s, c) {
  picture(x, y, "C:/Users/mioron13/OneDrive%20-%20Lärande/Bilder/mariostar.png");

var poang = 0;

  { x: random(400, totalWidth - 100), y: random(100, totalHeight - 100),}, //x

function drawZombie(x, y) {
  save();
  translate(x, y);
  rectangle(3, -10, 23, 65, "lightgreen");
  rectangle(3, -25, 23, 65, "gray");
  circle(15, -40, 20, "lightgreen");
  circle(0, -40, 3, "red");
  rectangle(-35, -20, 30, 14, "lightgreen");
  rectangle(-20, -20, 30, 14, "gray");
  restore();
}

function update() {
  clearScreen();
  text(20, 30, 24, "Zombiespelet", "black");

if(keyboard.space) {
  enemies.push({ x: random(400, totalWidth - 100), y: random(100, totalHeight - 100), });

}

  circle(player.x, player.y, player.size, player.color);

  if (keyboard.d) {
    player.x = player.x + player.speed;
  }
  if (keyboard.a) {
    player.x = player.x - player.speed;
  }
  if (keyboard.w) {
    player.y = player.y - player.speed;
  }
  if (keyboard.s) {
    player.y = player.y + player.speed;
  }

    
    ///EGEN KOD

    drawZombie(enemies[i].x, enemies[i].y)
    if(distance(player.x, player.y, enemies[i].x, enemies[i].y) < 65) {

  }

}

}
