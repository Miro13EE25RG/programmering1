<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="http://koda.nu/simple.js">
        //ONLY put code here if you want it to work.

        var playerPick = prompt("vilken spelarfärg? 0 = röd, 1 = grön, 2 = blå, 3 = gul, 4 = lila")
        //console.log(playerPick)

        var playerColors = [ "red", "green", "blue", "yellow", "purple"

        ]
        console.log(playerColors[playerPick]) 


        
var player = { x: 100, y: 300, size: 20, color: playerColors[playerPick], speed: 4 };

var zombie1 = { x: 300, y: 220, speed: 2 };
var zombie2 = { x: 500, y: 400, speed: 3 };
var zombie3 = { x: 700, y: 260 };
var poang = 0;

var enemies = [
  { x: random(200, 700), y: random(100, 550), speed: random(2, 4) },
  { x: random(200, 700), y: random(100, 550), speed: random(2, 4) },
  { x: random(200, 700), y: random(100, 550), speed: random(2, 4) },
  { x: random(200, 700), y: random(100, 550), speed: random(2, 4) },
  { x: random(200, 700), y: random(100, 550), speed: random(2, 4) },
  { x: random(200, 700), y: random(100, 550), speed: random(2, 4) }
];

function drawZombie(x, y) {
  save();
  translate(x, y);
  rectangle(3, -10, 23, 65, "lightgreen");
  rectangle(3, -25, 23, 65, "gray");
  circle(15, -40, 20, "lightgreen");
  circle(0, -40, 3, "red");
  rectangle(-35, -20, 30, 14, "lightgreen");
  rectangle(-20, -20, 30, 14, "gray");
  restore();
}

function touches(a,b){
  return distance(a,b) < 65

}

function update() {
  clearScreen();
  text(20, 30, 24, "Zombiespelet", "black");

  drawZombie(zombie1.x, zombie1.y);
  drawZombie(zombie2.x, zombie2.y);
  drawZombie(zombie3.x, zombie3.y);
  
    circle(player.x, player.y, player.size + 1, "black"); //player outline
  circle(player.x, player.y, player.size, player.color);

  if (keyboard.d) {
    player.x = player.x + player.speed;
  }
  if (keyboard.a) {
    player.x = player.x - player.speed;
  }
  if (keyboard.w) {
    player.y = player.y - player.speed;
  }
  if (keyboard.s) {
    player.y = player.y + player.speed;
  }
  if (keyboard.space) {
    player.speed = player.speed = 8
  }else {
    player.speed = 4
  }

  if (zombie1.x < player.x) {
    zombie1.x = zombie1.x + zombie1.speed;
  }
  if (zombie1.x > player.x) {
    zombie1.x = zombie1.x - zombie1.speed;
  }
  if (zombie1.y < player.y) {
    zombie1.y = zombie1.y + zombie1.speed;
  }
  if (zombie1.y > player.y) {
    zombie1.y = zombie1.y - zombie1.speed;
  }

  if (touches(player, zombie1)) {
    text(280, 250, 50, "GAME OVER", "red");
    stopUpdate();
  } else {
    poang = poang + 1;
    text(20, 70, 24, "Poäng: " + poang, "black");
  }

  if (touches(player, zombie2)) {
    text(280, 250, 50, "GAME OVER", "red");
    stopUpdate();
  } else {
    poang = poang + 1;
  }

  if (touches(player, zombie3)) {
    text(280, 250, 50, "GAME OVER", "red");
    stopUpdate();
  } else {
    poang = poang + 1;
  }

  for (var i = 0; i < enemies.length; i++) {

    if(enemies[i].x < player.x) {
      enemies[i].x = enemies[i].x + enemies[i].speed;
    }
    if(enemies[i].x > player.x) {
      enemies[i].x = enemies[i].x - enemies[i].speed;
    }
    if(enemies[i].y < player.y) {
      enemies[i].y = enemies[i].y + enemies[i].speed;
    }
    if(enemies[i].y > player.y) {
      enemies[i].y = enemies[i].y - enemies[i].speed;
    }
    //jag känner att zombie2 har bäst rörelsehastighet eftersom det känns organiskt, men inte för snabbt. 


    drawZombie(enemies[i].x, enemies[i].y);
    if (touches(player, enemies[i])) {
      text(280, 250, 50, "GAME OVER", "red");
      stopUpdate();
    }
  }
}
    </script>
</body>

</html>
