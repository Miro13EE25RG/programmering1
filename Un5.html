<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="http://koda.nu/simple.js">
    //ONLY put code here if you want it to work.


        var player = { x: 50, y: 50, size: 40, color: "blue", speedX: 6, directionX: 1, speedY: 4, directionY: 1, };

        function update(framespersecond = 120) {
            clearScreen()
            

            //spelaren och spelarens rörelse
            circle(player.x, player.y, player.size, player.color);
            player.x = player.x + player.speedX * player.directionX;
            player.y = player.y + player.speedY * player.directionY;







            //studsa mot höger kant
            if(player.x + player.size > totalWidth) {
                player.directionX = -1
                player.size = random(20, 60)
            }
            //studsa mot vänster kant
            if(player.x - player.size < 0) {
                player.directionX = 1
                player.speedX = random(2, 100)
                player.speedY = random(2, 100)
            }
            //studsa mot taket
            if(player.y - player.size < 0) {
                player.directionY = 1
                player.color = mixColor(random(0, 255), random(0, 255), random(0, 255))
            }
            //studsa mot golvet
            if(player.y + player.size > totalHeight) {
                player.directionY = -1
                player.color = mixColor(random(0, 255), random(0, 255), random(0, 255))
            }



            //func-update end
        }
     


    </script>
</body>
</html>
